<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Animated characters walking and writing locomotion and exoskeleton">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .ground{stroke:#334155;stroke-width:4}
      .body{stroke:#e2e8f0;stroke-width:6;stroke-linecap:round;fill:none}
      .accent{stroke:#38bdf8;stroke-width:4;stroke-linecap:round;fill:none}
      .word{font:700 46px 'Segoe UI',sans-serif;fill:none;stroke:#22d3ee;stroke-width:2.5;stroke-dasharray:700;stroke-dashoffset:700}
      .word2{stroke:#a78bfa}
      .pen{stroke:#f8fafc;stroke-width:2.5;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <line x1="30" y1="170" x2="1170" y2="170" class="ground"/>
  <line x1="30" y1="340" x2="1170" y2="340" class="ground"/>

  <text x="210" y="120" class="word">locomotion
    <animate attributeName="stroke-dashoffset" values="700;0;0;700" dur="6s" repeatCount="indefinite"/>
  </text>

  <text x="420" y="290" class="word word2">exoskeleton
    <animate attributeName="stroke-dashoffset" values="900;0;0;900" dur="6s" begin="0.6s" repeatCount="indefinite"/>
  </text>

  <g transform="translate(80 0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;820 0;0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="40" cy="95" r="16" class="body"/>
      <line x1="40" y1="111" x2="40" y2="145" class="body"/>
      <line x1="40" y1="124" x2="22" y2="140" class="body"/>
      <line x1="40" y1="124" x2="66" y2="120" class="body"/>
      <line x1="66" y1="120" x2="86" y2="110" class="pen"/>
      <line x1="40" y1="145" x2="26" y2="170" class="body">
        <animate attributeName="x2" values="26;48;26" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="40" y1="145" x2="54" y2="170" class="body">
        <animate attributeName="x2" values="54;32;54" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="84" y1="109" x2="130" y2="109" class="accent">
        <animate attributeName="x2" values="88;155;88" dur="6s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <g transform="translate(1030 0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-820 0;0 0" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      <circle cx="40" cy="265" r="16" class="body"/>
      <line x1="40" y1="281" x2="40" y2="315" class="body"/>
      <line x1="40" y1="294" x2="24" y2="312" class="body"/>
      <line x1="40" y1="294" x2="62" y2="290" class="body"/>
      <line x1="62" y1="290" x2="82" y2="280" class="pen"/>
      <line x1="40" y1="315" x2="28" y2="340" class="body">
        <animate attributeName="x2" values="28;50;28" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="40" y1="315" x2="52" y2="340" class="body">
        <animate attributeName="x2" values="52;30;52" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
      </line>
      <line x1="80" y1="279" x2="126" y2="279" class="accent">
        <animate attributeName="x2" values="84;160;84" dur="6s" begin="0.6s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
